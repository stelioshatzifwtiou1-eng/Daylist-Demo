<style>
:root{--bg:#f6f4ee;--surface:#fff;--ink:#14263a;--muted:#5d6b7a;--line:#dcd8cc;--accent:#0f6b5c;--accent-ink:#fff;--sun:#f2b632;--danger:#b3412f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a26;--surface:#162636;--ink:#eef2f5;--muted:#9fb0bf;--line:#2a3d50;--accent:#3fc2a8;--accent-ink:#06231d;--sun:#f2b632;--danger:#ef8a77}}
:root[data-theme="dark"]{--bg:#0e1a26;--surface:#162636;--ink:#eef2f5;--muted:#9fb0bf;--line:#2a3d50;--accent:#3fc2a8;--accent-ink:#06231d;--sun:#f2b632;--danger:#ef8a77}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:480px;margin:0 auto;padding:20px 18px 96px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:2rem;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.1}
.sub{color:var(--muted);margin:4px 0 0}
.pill{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:600 .85rem inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.pill.pro{background:var(--sun);border-color:var(--sun);color:#2b1f00}
.ring{margin:22px 0 8px;display:flex;align-items:center;gap:16px}
.ring svg{flex:none}
.ring b{font-size:1.15rem;display:block}
.list{list-style:none;margin:12px 0 0;padding:0;border-top:1.5px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1.5px solid var(--line)}
.chk{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--accent-ink);font-size:1rem;padding:0}
.chk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.label{flex:1;min-width:0}
.label span{display:block;font-weight:600;overflow-wrap:anywhere}
.label small{color:var(--muted)}
.done .label span{text-decoration:line-through;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:6px}
.add{display:flex;gap:8px;margin-top:16px}
.add input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 18px;font:600 1rem inherit;font-family:inherit;cursor:pointer}
.limit{color:var(--muted);font-size:.85rem;margin-top:8px}
.empty{padding:24px 2px;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:480px}

.sheet{position:fixed;inset:0;background:rgba(8,16,24,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto}
.panel h2{margin:0 0 6px;font-size:1.6rem;letter-spacing:-.02em}
.perks{list-style:none;padding:0;margin:14px 0}
.perks li{padding:6px 0 6px 28px;position:relative}
.perks li:before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:800}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.plan{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:14px;text-align:left;font:inherit;cursor:pointer}
.plan[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.plan b{display:block;font-size:1.3rem}
.plan em{font-style:normal;color:var(--accent);font-weight:600;font-size:.85rem}
.fine{color:var(--muted);font-size:.8rem;margin:12px 0 0}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:8px 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.xpbar{display:flex;align-items:center;gap:10px;margin-top:16px}
.xpbar .lv{font-weight:800;background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 12px;font-size:.85rem;white-space:nowrap}
.track{flex:1;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--sun));width:0;transition:width .6s cubic-bezier(.2,1.4,.4,1)}
.xpbar small{color:var(--muted);white-space:nowrap}
.snd{background:none;border:0;font-size:1.2rem;cursor:pointer;padding:2px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
.chk.pop{animation:pop .5s cubic-bezier(.2,2,.4,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.float{position:fixed;font-weight:800;font-size:1.4rem;color:var(--sun);text-shadow:0 2px 0 rgba(0,0,0,.4);pointer-events:none;z-index:26;animation:fl 1s ease-out forwards;transform:translate(-50%,0)}
@keyframes fl{to{transform:translate(-50%,-80px) scale(1.3);opacity:0}}
.banner{position:fixed;inset:0;display:grid;place-items:center;z-index:25;pointer-events:none;opacity:0}
.banner b{font-size:2.5rem;font-weight:800;text-align:center;padding:18px 26px;background:var(--sun);color:#2b1f00;border-radius:22px;transform:rotate(-3deg);box-shadow:0 12px 40px rgba(0,0,0,.35);max-width:90%}
.banner.show{animation:bn 2.1s forwards}
@keyframes bn{0%{opacity:0;transform:scale(.3)}12%{opacity:1;transform:scale(1.12)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.shake{animation:sk .5s}
@keyframes sk{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.shake,.chk.pop,.float{animation:none!important}}
